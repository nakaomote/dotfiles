font_family FiraCode Nerd Font Mono
font_size   16.0
force_ltr   True
clipboard_control write-clipboard write-primary no-append
map cmd+backspace send_text all \x1b\x7f
map cmd+enter send_text all \x1b\r
map cmd+c send_text all \x1bc
map cmd+N send_text all \x1bn
map cmd+K send_text all \x1bK
map cmd+J send_text all \x1bJ
map cmd+Shift+L send_text all \x1bL
map cmd+Shift+M send_text all \x1bm
map option+shift+j pass
map option+shift+k pass

# noop command+f kitty internals:
map cmd+f no_op

# Ensure Kitty respects system window manager (Amethyst) settings
remember_window_size yes
single_window yes

# Map for tmux window selections.
map cmd+1 send_text all \x1b1
map cmd+2 send_text all \x1b2
map cmd+3 send_text all \x1b3
map cmd+4 send_text all \x1b4
map cmd+5 send_text all \x1b5
map cmd+6 send_text all \x1b6
map cmd+7 send_text all \x1b7
map cmd+8 send_text all \x1b8
map cmd+9 send_text all \x1b9

# Map for tmux pane selections.
# Direct pane selection (Command + Shift + number)
map cmd+shift+1 send_text all \x1b!
map cmd+shift+2 send_text all \x1b@
map cmd+shift+3 send_text all \x1b#
map cmd+shift+4 send_text all \x1b$
map cmd+shift+5 send_text all \x1b%
map cmd+shift+6 send_text all \x1b^
map cmd+shift+7 send_text all \x1b&
map cmd+shift+8 send_text all \x1b*
map cmd+shift+9 send_text all \x1b(
map cmd+shift+0 send_text all \x1b)
